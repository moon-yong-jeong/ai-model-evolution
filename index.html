<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Evolution of AI Models</title>
<meta name="description" content="A narrative visualization of how AI models scaled up for a decade — and then diverged into an ever-larger frontier and a new wave of on-device models." />

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-svg-annotation@2.5.1/d3-annotation.min.js"></script>

<style>
  :root{
    /* Theme colors */
    --bg:#0e1117;
    --panel:#161b22;
    --grid:#21262d;
    --ink:#e6edf3;
    --muted:#8b949e;

    /* Accents colors */
    --accent:#58a6ff;
    --accent-soft:#7cc0ff;

    --dot-frontier:#ffb7c5;    
    --dot-efficient:#a4d65e;   

    /* On-device zone bracket + arrow */
    --efficient:#3fb950;       
    
    /* Layout */
    --page:1120px;
    --side:288px;
    --radius:8px;
  }

  /* Page shell */
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
  }
  header{max-width:var(--page);margin:0 auto;padding:24px 20px 4px}
  h1{font-size:26px;margin:0 0 4px}
  header p{color:var(--muted);margin:0;font-size:14px}
  #app{max-width:var(--page);margin:0 auto;padding:8px 20px 40px}

  /* Controls: prev/next, step dots, progress */
  .controls{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    margin:10px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--grid);
  }
  button{
    background:var(--panel);color:var(--ink);border:1px solid var(--grid);
    padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:14px;
  }
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.active{background:var(--accent);color:#04122b;border-color:var(--accent);font-weight:600}

  .steps{display:flex;gap:6px}
  .step-dot{
    width:26px;height:26px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--muted);
  }
  .step-dot.active{background:var(--accent);color:#04122b;border-color:var(--accent);font-weight:700}

  .spacer{flex:1}
  .progress{color:var(--muted);font-size:13px}

  /* Stage: narration left, chart right */
  .stage{display:flex;gap:26px;align-items:flex-start}
  .side{flex:0 0 var(--side);max-width:var(--side)}
  .plot{flex:1 1 auto;min-width:0}
  @media (max-width:820px){
    .stage{flex-direction:column}
    .side{flex-basis:auto;max-width:none}
  }

  .scene-title{font-size:19px;margin:0 0 8px;line-height:1.25}
  .scene-sub{color:var(--ink);font-size:14px;margin:0 0 12px;opacity:.9}
  .hint{
    color:var(--muted);font-size:12px;margin-top:14px;
    padding-top:10px;border-top:1px dashed var(--grid);
  }
  .src{
    color:var(--muted);font-size:11px;margin-top:18px;
    padding-top:10px;border-top:1px solid var(--grid);
  }

  /* Company highlight chips */
  .filterbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .filterbar .lbl{color:var(--muted);font-size:13px;width:100%;margin-bottom:2px}
  .chip{font-size:12px;padding:5px 9px}

  /* Chart: axes, marks, legends, annotations */
  svg{width:100%;height:auto;background:var(--panel);border-radius:12px}
  .axis path,.axis line{stroke:var(--grid)}
  .axis text{fill:var(--muted);font-size:11px}
  .axis-label{fill:var(--ink);font-size:13px}
  .dot{cursor:pointer;transition:opacity .3s,r .2s}
  .legend text{fill:var(--muted);font-size:12px}

  /* Annotation styling */
  .annotation-note-title{fill:var(--ink);font-weight:600;font-size:12px}
  .annotation-note-label{fill:var(--muted);font-size:11px}
  .annotation path{stroke:var(--ink)}
  .annotation-note-bg{fill:rgba(0,0,0,0)}

  /* Tooltip */
  #tooltip{
    position:fixed;z-index:10;pointer-events:none;opacity:0;
    background:#0b0f14;border:1px solid var(--accent);border-radius:var(--radius);
    padding:8px 10px;font-size:12px;max-width:240px;transition:opacity .12s;
  }
  #tooltip b{color:var(--accent)}
</style>
</head>

<body>
<header>
  <h1>The Evolution of AI Models</h1>
  <p>How AI models scaled up for a decade — and then began to diverge into two directions.</p>
</header>

<main id="app">
  <!-- Scene navigation -->
  <nav class="controls" aria-label="Scene navigation">
    <button id="prev">&#8249; Prev</button>
    <button id="next">Next &#8250;</button>
    <div class="steps" id="steps"></div>
    <span class="spacer"></span>
    <span class="progress" id="progress" aria-live="polite"></span>
  </nav>

  <div class="stage">
    <!-- Narration + filters -->
    <aside class="side">
      <h2 class="scene-title" id="sceneTitle"></h2>
      <p class="scene-sub" id="sceneSub"></p>
      <div class="filterbar" id="filterbar"></div>
      <p class="hint" id="hint"></p>
    </aside>

    <!-- SVG viewBox set by app.js -->
    <section class="plot">
      <svg id="chart" role="img" aria-labelledby="sceneTitle sceneSub"></svg>
      <p class="src" id="srcNote"></p>
    </section>
  </div>
</main>

<div id="tooltip" role="tooltip"></div>

<script src="models.js"></script>
<script src="eci_models.js"></script>
<script src="app.js"></script>
</body>
</html>
